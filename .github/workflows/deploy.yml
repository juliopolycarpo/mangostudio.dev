name: Deploy

# Production deploys happen only from main. The `verify` job runs first; the
# `deploy` job is gated behind the protected `production` GitHub Environment,
# so approval (and the Cloudflare secrets) are requested only after checks pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: QA gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run QA gate
        run: bun run qa

  deploy:
    # workflow_dispatch can select any ref; only main may reach production.
    if: github.ref == 'refs/heads/main'
    name: Deploy to Cloudflare Workers
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://mangostudio.dev
    env:
      # Honour MangoStudio's no-telemetry stance for the deploy tooling too.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      # Cache entries are written only by this serialized deploy job, scoped to its branch.
      # A unique run attempt key also supports manually redeploying the same commit.
      - name: Restore previous production assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deploy-assets
          key: production-assets-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-assets-v1-${{ runner.os }}-

      - name: Retain recent production assets
        env:
          ASSET_CACHE_DIR: ${{ runner.temp }}/deploy-assets
          DEPLOY_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bun scripts/retain-deploy-assets.ts dist/_astro "$ASSET_CACHE_DIR" "$DEPLOY_GENERATION"

      - name: Audit public static output
        run: bun run audit:static

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Record successful deployment time
        env:
          ASSET_CACHE_DIR: ${{ runner.temp }}/deploy-assets
          DEPLOY_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bun scripts/retain-deploy-assets.ts dist/_astro "$ASSET_CACHE_DIR" "$DEPLOY_GENERATION" --confirm

      # Save only after Wrangler succeeds. A failed smoke check must not discard
      # the assets of a deploy that has already reached production.
      - name: Save production assets
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deploy-assets
          key: production-assets-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke test production URLs
        run: bun run smoke:production
