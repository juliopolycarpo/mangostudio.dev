version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current and auditable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "type: ci"
      - "type: dependencies"
    groups:
      actions:
        patterns: ["*"]

  # Astro + toolchain dependencies (Bun keeps package.json and bun.lock in sync).
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - "type: dependencies"
    # astro check needs the TypeScript 6 JavaScript API, which TypeScript 7 no longer exports.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
